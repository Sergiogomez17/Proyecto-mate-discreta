# Publica GraphLab UVG en GitHub Pages: https://sergiogomez17.github.io/Proyecto-mate-discreta/
# Se ejecuta en cada push a main (y a mano desde la pestaña Actions). Requisito único en GitHub,
# ANTES de la primera ejecución: Settings → Pages → Build and deployment → Source: «GitHub Actions».
#
# Si «Configurar GitHub Pages» falla con «HttpError: Not Found / Get Pages site failed», Pages no
# estaba activado cuando corrió el workflow. Actívelo como se indica arriba y vuelva a ejecutar el
# workflow (Actions → la ejecución fallida → «Re-run all jobs»). No se usa `enablement: true` en
# configure-pages: activar Pages desde el workflow exige un token personal o de una GitHub App con
# permiso de administración; con el GITHUB_TOKEN de siempre esa opción falla.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no se cancela uno en curso para no dejar el sitio a medias.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código (ESLint)
        run: npm run lint

      - name: Ejecutar las pruebas
        run: npm test

      - name: Compilar para producción
        # Incluye la comprobación de tipos (tsc -b). GitHub Pages publica el sitio en la carpeta
        # /Proyecto-mate-discreta/ (en otros destinos la base por defecto es /).
        run: npm run build
        env:
          BASE_PATH: /Proyecto-mate-discreta/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir el sitio compilado
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
